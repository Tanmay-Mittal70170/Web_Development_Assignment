<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLA University - Photo Gallery</title>
    <style>
        /* Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f9fafb;
            color: #333;
        }

        /* Header / Navbar Styling using Flexbox */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b192c;
            padding: 15px 50px;
            color: #ffffff;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logo-img {
            height: 45px;
            width: auto;
            object-fit: contain;
        }

        .university-name {
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .university-name span {
            font-size: 12px;
            font-weight: normal;
            letter-spacing: 3px;
            display: block;
            color: #ccc;
        }

        nav {
            display: flex;
            gap: 40px;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 1px;
            padding-bottom: 5px;
            position: relative;
        }

        nav a.active::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -5px;
            width: 100%;
            height: 2px;
            background-color: #d9a74a;
        }

        /* Main Section */
        main {
            padding: 40px 20px;
            text-align: center;
        }

        .gallery-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
            color: #1a202c;
            margin-bottom: 15px;
        }

        .gallery-title span {
            color: #d99b26;
        }

        /* Divider with Camera Icon using Flexbox */
        .title-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
        }

        .title-divider hr {
            width: 60px;
            border: none;
            border-top: 2px solid #d99b26;
        }

        .camera-icon {
            font-size: 18px;
            color: #d99b26;
        }

        /* Photo Gallery Grid Container using Flexbox */
        .gallery-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Individual Card Styling */
        .gallery-card {
            background-color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            width: 360px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
        }

        .gallery-card:hover {
            transform: translateY(-5px);
        }

        .gallery-card img {
            width: 100%;
            height: 240px;
            object-fit: cover;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo-container">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRPEh9H4cOcGb5J5GGlf8iyQhd3mo8lWgw0e52rFeQcZQ&s=10" alt="GLA University Logo" class="logo-img">
            <div class="university-name">
                GLA
                <span>UNIVERSITY</span>
            </div>
        </div>
        <nav>
            <a href="#" class="active">HOME</a>
            <a href="#">GALLERY</a>
            <a href="#">ABOUT</a>
        </nav>
    </header>

    <!-- Main Content Area -->
    <main>
        <h1 class="gallery-title">PHOTO <span>GALLERY</span></h1>
        
        <div class="title-divider">
            <hr>
            <span class="camera-icon">📷</span>
            <hr>
        </div>

        <!-- Gallery Flex Container -->
        <div class="gallery-container">
            <!-- Card 1 -->
            <div class="gallery-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKbYsldnUyVdyPtZ4RJ-ErQLnbyIap3DFWYS504VJQpQ&s" alt="Statue portrait">
            </div>
            <!-- Card 2 -->
            <div class="gallery-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgvMYoGATESTYSMLlbwR9rKDxzmRpQ-8dayV_ENaU_Lg&s=10" alt="Model Train">
            </div>
            <!-- Card 3 -->
            <div class="gallery-card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Vintage Camera">
            </div>
            <!-- Card 4 -->
            <div class="gallery-card">
                <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Vintage Camera">
            </div>
            <!-- Card 5 -->
            <div class="gallery-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQgvMYoGATESTYSMLlbwR9rKDxzmRpQ-8dayV_ENaU_Lg&s=10" alt="Model Train">
            </div>
            <!-- Card 6 -->
            <div class="gallery-card">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTKbYsldnUyVdyPtZ4RJ-ErQLnbyIap3DFWYS504VJQpQ&s" alt="Statue portrait">
            </div>
        </div>
    </main>

</body>
</html>
