<!DOCTYPE html>
<html lang="en">
<head>
   
    <title>Grid Layout</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .row {
            display: flex;
            gap: 15px;
        }

        .box {
            background-color: #404040;
            color: #ffffff;
            font-size: 28px;
            height: 100px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            padding-left: 25px;
        }

        .box-a {
            flex: 50%;
        }

        .box-b {
            flex: 50%;
        }

        .box-c {
            flex: 25%;
        }

        .box-d {
            flex: 75%;
        }

        .box-e {
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="row">
            <div class="box box-a">A</div>
            <div class="box box-b">B</div>
        </div>
        <div class="row">
            <div class="box box-c">C</div>
            <div class="box box-d">D</div>
        </div>
        <div class="row">
            <div class="box box-e">E</div>
        </div>
    </div>

</body>
</html>
