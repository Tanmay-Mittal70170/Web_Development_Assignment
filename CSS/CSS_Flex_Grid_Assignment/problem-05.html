<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Hiring Partners</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            
            background-color: #fcf8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .partners-section {
            background-color: #fffafb;
            padding: 60px 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 1100px;
            width: 100%;
        }

        .sub-heading {
            font-size: 18px;
            font-weight: 600;
            color: #4a4a4a;
            margin-bottom: 8px;
        }

        .main-heading {
            font-size: 32px;
            font-weight: 800;
            color: #111111;
            margin-bottom: 45px;
        }

        .partners-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 16px;
            margin-bottom: 45px;
        }

        .partner-card {
            background-color: #ffffff;
            border-radius: 12px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid #f3e8e9;
            
        }

        .partner-card:hover {
           
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
        }

        .partner-card img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-container {
            display: flex;
            justify-content: center;
        }

        .see-more-btn {
            display: inline-block;
            border: 1px solid #ff4d6d;
            color: #ff4d6d;
            background-color: #ffffff;
            padding: 10px 22px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-radius: 6px;
           
        }

        .see-more-btn:hover {
            background-color: #ff4d6d;
            color: #ffffff;
        }

    </style>
</head>
