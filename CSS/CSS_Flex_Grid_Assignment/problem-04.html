<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Keyboard UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #00bcd4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }

        .keyboard-container {
            background-color: #22252a;
            padding: 24px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: max-content;
        }

        .row {
            display: flex;
            gap: 8px;
        }

        .key {
            background: linear-gradient(145deg, #2a2d34, #212429);
            color: #00bcd4;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 40px;
            min-width: 40px;
            border-radius: 6px;
            box-shadow: 3px 3px 6px #181a1e, -1px -1px 3px #32363e;
            padding: 0 8px;
        }

        .key:active {
            box-shadow: inset 2px 2px 5px #181a1e, inset -2px -2px 5px #32363e;
        }

        .w-delete { flex: 1.5; }
        .w-tab { flex: 1.2; }
        .w-slash { flex: 1.2; }
        .w-caps { flex: 1.4; }
        .w-enter { flex: 2.2; }
        .w-shift-l { flex: 1.8; }
        .w-shift-r { flex: 2.5; }
        .w-space { flex: 6; }
    </style>
</head>
<body>

    <div class="keyboard-container">
        <div class="row">
            <div class="key">~</div>
            <div class="key">1</div>
            <div class="key">2</div>
            <div class="key">3</div>
            <div class="key">4</div>
            <div class="key">5</div>
            <div class="key">6</div>
            <div class="key">7</div>
            <div class="key">8</div>
            <div class="key">9</div>
            <div class="key">0</div>
            <div class="key w-delete">delete</div>
        </div>

        <div class="row">
            <div class="key w-tab">tab</div>
            <div class="key">Q</div>
            <div class="key">W</div>
            <div class="key">E</div>
            <div class="key">R</div>
            <div class="key">T</div>
            <div class="key">Y</div>
            <div class="key">U</div>
            <div class="key">I</div>
            <div class="key">O</div>
            <div class="key">P</div>
            <div class="key w-slash">\</div>
        </div>

        <div class="row">
            <div class="key w-caps">caps</div>
            <div class="key">A</div>
            <div class="key">S</div>
            <div class="key">D</div>
            <div class="key">F</div>
            <div class="key">G</div>
            <div class="key">H</div>
            <div class="key">J</div>
            <div class="key">K</div>
            <div class="key">L</div>
            <div class="key w-enter">Enter</div>
        </div>

        <div class="row">
            <div class="key w-shift-l">Shift</div>
            <div class="key">Z</div>
            <div class="key">X</div>
            <div class="key">C</div>
            <div class="key">V</div>
            <div class="key">B</div>
            <div class="key">N</div>
            <div class="key">M</div>
            <div class="key">&lt;</div>
            <div class="key">&gt;</div>
            <div class="key w-shift-r">Shift</div>
        </div>

        <div class="row">
            <div class="key">&#127760;</div>
            <div class="key">control</div>
            <div class="key">option</div>
            <div class="key">alt</div>
            <div class="key w-space">Space</div>
            <div class="key">alt</div>
            <div class="key">option</div>
            <div class="key">&larr;</div>
            <div class="key">&rarr;</div>
        </div>
    </div>

</body>
</html>
