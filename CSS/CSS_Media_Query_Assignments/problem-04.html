<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100vh;
        }

        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
            background-color: #ffffff;
        }

        .navigation {
            background-color: #ffff00;
            color: #000000;
            font-size: 32px;
            padding: 15px 20px;
            width: 100%;
        }

        .content-container {
            display: flex;
            gap: 10px;
            width: 100%;
            flex: 1;
        }

        .left-box {
            background-color: #ff0000;
            color: #444444;
            font-size: 18px;
            padding: 15px;
            flex: 3;
        }

        .right-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .right-box {
            background-color: #00ff00;
            color: #444444;
            font-size: 18px;
            padding: 15px;
            flex: 1;
        }

        @media screen and (max-width: 900px) {
            .content-container {
                flex-direction: column;
            }

            .left-box {
                flex: 2;
            }

            .right-container {
                flex-direction: row;
                flex: 1;
            }
        }

        @media screen and (max-width: 600px) {
            .left-box {
                flex: 1;
            }

            .right-container {
                flex-direction: column;
                flex: 3;
            }
        }
    </style>
</head>
<body>

    <header class="navigation">
        Navigation
    </header>

    <main class="content-container">
        <div class="left-box">
            LEFT BOX
        </div>
        <div class="right-container">
            <div class="right-box">
                RIGHT BOX 1
            </div>
            <div class="right-box">
                RIGHT BOX 2
            </div>
            <div class="right-box">
                RIGHT BOX 3
            </div>
        </div>
    </main>

</body>
</html>
