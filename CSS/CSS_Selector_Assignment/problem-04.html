<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Periodic Table of Elements</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #000000;
        }

        h1 {
            font-size: 26px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-bottom: 30px;
            text-align: center;
        }

        .periodic-table {
            display: grid;
            grid-template-columns: repeat(18, 36px);
            grid-template-rows: repeat(7, 36px);
            gap: 6px;
            margin-bottom: 45px;
        }

        .cell {
            border: 1px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: normal;
            user-select: none;
        }

        /* Color classes */
        .red-h {
            background-color: #a60000;
            color: #ffffff;
            font-weight: bold;
            font-size: 18px;
        }

        .olive {
            background-color: #889e28;
        }

        .pink-num {
            background-color: #f25252;
            color: #000000;
            font-size: 13px;
        }

        .beige {
            background-color: #fdf0e6;
        }

        .blue {
            background-color: #0000ff;
        }

        .yellow {
            background-color: #ffd000;
        }

        .hot-pink {
            background-color: #ff0055;
        }

        .purple {
            background-color: #90006f;
        }

        .green {
            background-color: #519c2d;
        }

        .orange {
            background-color: #ff5f00;
        }

        .dark-grey {
            background-color: #615257;
        }

        /* Large Silicon Feature Box */
        .silicon-box {
            grid-column: 4 / span 4;
            grid-row: 2 / span 2;
            background-color: #889e28;
            border: 1px solid #000000;
            padding: 6px 10px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .silicon-box .number {
            position: absolute;
            top: 6px;
            right: 10px;
            font-size: 13px;
        }

        .silicon-box .symbol {
            font-size: 42px;
            font-weight: 500;
            line-height: 1;
            margin-top: 12px;
        }

        .silicon-box .name {
            font-size: 12px;
        }

        /* Bottom Grid Section */
        .bottom-section {
            display: flex;
            flex-direction: column;
            width: calc(15 * 32px);
            border: 1px solid #000000;
        }

        .bottom-row {
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            height: 30px;
        }

        .bottom-cell {
            border: 0.5px solid #2d381b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            position: relative;
        }

        .lanthanides {
            background-color: #3d4926;
            color: #ffffff;
        }

        .actinides {
            background-color: #89a247;
            color: #1a2e05;
        }

        .label-la {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 11px;
        }

        .label-am {
            position: absolute;
            bottom: 2px;
            font-size: 11px;
        }

        .label-no {
            position: absolute;
            bottom: 2px;
            right: 3px;
            font-size: 11px;
        }
    </style>
</head>
<body>

    <h1>THE PERIODIC TABLE OF ELEMENTS</h1>

    <div class="periodic-table">
        <!-- ROW 1 -->
        <div class="cell red-h" style="grid-column: 1; grid-row: 1;">H</div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 1;"></div>

        <!-- ROW 2 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 2;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 2;">4</div>
        
        <!-- Silicon Box (Spans Row 2-3, Col 4-7) -->
        <div class="silicon-box">
            <span class="number">14</span>
            <span class="symbol">Si</span>
            <span class="name">Silicon</span>
        </div>

        <div class="cell purple" style="grid-column: 13; grid-row: 2;"></div>
        <div class="cell green" style="grid-column: 14; grid-row: 2;"></div>
        <div class="cell green" style="grid-column: 15; grid-row: 2;"></div>
        <div class="cell green" style="grid-column: 16; grid-row: 2;"></div>
        <div class="cell hot-pink" style="grid-column: 17; grid-row: 2;"></div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 2;"></div>

        <!-- ROW 3 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 3;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 3;">12</div>

        <div class="cell orange" style="grid-column: 13; grid-row: 3;"></div>
        <div class="cell purple" style="grid-column: 14; grid-row: 3;"></div>
        <div class="cell green" style="grid-column: 15; grid-row: 3;"></div>
        <div class="cell green" style="grid-column: 16; grid-row: 3;"></div>
        <div class="cell hot-pink" style="grid-column: 17; grid-row: 3;"></div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 3;"></div>

        <!-- ROW 4 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 4;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 4;">20</div>
        <!-- 9 Blue Transition Metals -->
        <div class="cell blue" style="grid-column: 4; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 5; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 6; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 7; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 8; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 9; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 10; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 11; grid-row: 4;"></div>
        <div class="cell blue" style="grid-column: 12; grid-row: 4;"></div>

        <div class="cell orange" style="grid-column: 13; grid-row: 4;"></div>
        <div class="cell purple" style="grid-column: 14; grid-row: 4;"></div>
        <div class="cell purple" style="grid-column: 15; grid-row: 4;"></div>
        <div class="cell green" style="grid-column: 16; grid-row: 4;"></div>
        <div class="cell hot-pink" style="grid-column: 17; grid-row: 4;"></div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 4;"></div>

        <!-- ROW 5 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 5;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 5;">38</div>
        <div class="cell blue" style="grid-column: 4; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 5; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 6; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 7; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 8; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 9; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 10; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 11; grid-row: 5;"></div>
        <div class="cell blue" style="grid-column: 12; grid-row: 5;"></div>

        <div class="cell orange" style="grid-column: 13; grid-row: 5;"></div>
        <div class="cell orange" style="grid-column: 14; grid-row: 5;"></div>
        <div class="cell purple" style="grid-column: 15; grid-row: 5;"></div>
        <div class="cell purple" style="grid-column: 16; grid-row: 5;"></div>
        <div class="cell hot-pink" style="grid-column: 17; grid-row: 5;"></div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 5;"></div>

        <!-- ROW 6 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 6;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 6;">56</div>
        <div class="cell beige" style="grid-column: 3; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 4; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 5; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 6; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 7; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 8; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 9; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 10; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 11; grid-row: 6;"></div>
        <div class="cell blue" style="grid-column: 12; grid-row: 6;"></div>

        <div class="cell orange" style="grid-column: 13; grid-row: 6;"></div>
        <div class="cell orange" style="grid-column: 14; grid-row: 6;"></div>
        <div class="cell orange" style="grid-column: 15; grid-row: 6;"></div>
        <div class="cell purple" style="grid-column: 16; grid-row: 6;"></div>
        <div class="cell hot-pink" style="grid-column: 17; grid-row: 6;"></div>
        <div class="cell yellow" style="grid-column: 18; grid-row: 6;"></div>

        <!-- ROW 7 -->
        <div class="cell olive" style="grid-column: 1; grid-row: 7;"></div>
        <div class="cell pink-num" style="grid-column: 2; grid-row: 7;">88</div>
        <div class="cell beige" style="grid-column: 3; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 4; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 5; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 6; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 7; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 8; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 9; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 10; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 11; grid-row: 7;"></div>
        <div class="cell blue" style="grid-column: 12; grid-row: 7;"></div>

        <div class="cell dark-grey" style="grid-column: 13; grid-row: 7;"></div>
        <div class="cell dark-grey" style="grid-column: 14; grid-row: 7;"></div>
        <div class="cell dark-grey" style="grid-column: 15; grid-row: 7;"></div>
        <div class="cell dark-grey" style="grid-column: 16; grid-row: 7;"></div>
        <div class="cell dark-grey" style="grid-column: 17; grid-row: 7;"></div>
        <div class="cell dark-grey" style="grid-column: 18; grid-row: 7;"></div>
    </div>

    <!-- Bottom Lanthanides / Actinides Block -->
    <div class="bottom-section">
        <div class="bottom-row">
            <div class="bottom-cell lanthanides"><span class="label-la">La</span></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
            <div class="bottom-cell lanthanides"></div>
        </div>
        <div class="bottom-row">
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"><span class="label-am">Am</span></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"></div>
            <div class="bottom-cell actinides"><span class="label-no">No</span></div>
        </div>
    </div>

</body>
</html>
